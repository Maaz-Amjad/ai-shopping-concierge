seed: 42
dataset: {name: amazon_reviews_2023, category: Appliances, max_items: 10000, min_user_interactions: 5}
embedding: {model: BAAI/bge-small-en-v1.5, query_instruction: true, batch_size: 64}   # dev S5 judged-only NDCG@10 (depth-50 condensed): prefix 0.795 vs none 0.785 (28 Oct)
retrieval: {mode: filter_first, k0: 100, k_max: 1000, pool_size: 200}
ranking: {w_sem: 0.7, w_pers: 0.25, w_pop: 0.05}
llm:
  # provider: gemini | openai | anthropic. Reported results use gemini; switch here to run on another model.
  #   ChatGPT:      provider: openai, model: <an OpenAI model>, key OPENAI_API_KEY in .env
  #   Open-weight:  provider: openai, base_url: http://localhost:11434/v1 (Ollama; vLLM/LM Studio similar),
  #                 model: <e.g. llama3.1>, no key needed for a local server
  #   Claude:       provider: anthropic, model: <e.g. claude-haiku-5-5>, key ANTHROPIC_API_KEY in .env
  #   (set judge_model too; optional api_key_env overrides the key variable name)
  provider: gemini
  model: gemini-3.5-flash-lite        # parser and generator
  judge_model: gemini-3.8-flash       # relevance judge (must differ from generator)
  judge_rpm: 4                        # free tier: 5 RPM, 250K TPM, 20 RPD (AI Studio, 27 Oct)
  judge_max_output_tokens: 32768      # thinking tokens count too: 8192 truncated q04 (31 products)
  temperature: 0
  max_output_tokens: 400
  rpm: 10                             # global client-side rate limit
  cache_path: artifacts/llm_cache.jsonl
  call_log_path: artifacts/llm_calls.jsonl
generation: {top_n: 5, max_words: 120}
eval: {k: [5, 10], pool_depth: 10, bootstrap_resamples: 1000}
# Phase 11 demo/API/MCP (NFR-3 spending cap; read-only service)
app:
  max_llm_calls: 300                  # per server process (Flash-Lite free tier: 500 RPD); then template answers
  allowed_origins: ["http://localhost:8000", "http://127.0.0.1:8000"]   # add each store's domain for the widget
  # Phase 13.4: requests per minute per client (llm = /search and /chat); API key per store (X-API-Key header,
  # stores/<name>/secrets.json; CONCIERGE_API_KEY for the demo catalog); trust X-Forwarded-For only behind a proxy
  rate_limit_per_minute: {llm: 30, other: 120}
  require_api_key: false
  trust_proxy: false
  request_log: artifacts/api_requests.jsonl     # method, path, store, status, ms; no query text, no IP address
  # production weights for the app, API and MCP server (Phase 13.1): rating term chosen on dev (w_rat 0.10);
  # test effect on relevance neutral. The benchmark and experiments keep the spec weights in `ranking` above.
  # pers_factor_with_limits (Phase 13.3): share of w_pers kept when a request states price/category/brand limits.
  # Dev chose 1.0 (off); test disagreed (0.5 would have helped), so it stays off until a larger dev set decides.
  ranking: {w_sem: 0.6, w_pers: 0.25, w_pop: 0.05, w_rat: 0.1, pers_factor_with_limits: 1.0}
  # Phase 13.5: share of BM25 keyword score blended into filter-first retrieval (chosen on dev; test: judged-only
  # NDCG@10 +0.044 [-0.010, +0.109], plain -0.025 with 12 % unjudged). Benchmark `retrieval` has none (= S5).
  retrieval: {hybrid_alpha: 0.5}
